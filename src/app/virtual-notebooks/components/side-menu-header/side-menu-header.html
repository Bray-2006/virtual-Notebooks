
    <nav class="navbar w-full border-b border-base-200 bg-base-300 px-2 sm:px-4">
      <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost drawer-button">
        <!-- Sidebar toggle icon -->
        <i class="pi pi-bars"></i>
      </label>
      <div class="flex items-center gap-3 px-3">
        <div class="flex size-10 items-center justify-center rounded-xl bg-primary text-primary-content shadow-sm">
          <i class="pi pi-book text-xl font-bold" aria-hidden="true"></i>
        </div>
        <div class="leading-tight">
          <p class="text-base font-bold tracking-tight ">Virtual Notebooks</p>
          <p class="text-xs text-base-content/60">Tu espacio de conocimiento</p>
        </div>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <p-selectbutton
          [options]="modeOptions"
          [(ngModel)]="selectedMode"
          optionLabel="label"
          optionValue="value"
          (onChange)="setMode($event.value)"
          ariaLabel="Elegir tema claro u oscuro"
        >
          <ng-template #item let-option>
            <i [class]="option.icon" [attr.aria-label]="option.label"></i>
          </ng-template>
        </p-selectbutton>

        <button
          pButton
          type="button"
          
          rounded
          aria-label="Abrir selector de paleta y tema"
          (click)="palettePopover.toggle($event)"
        >
          <i pButtonIcon class="pi pi-palette"></i>  
      </button>

        <p-popover #palettePopover>
          <div class="w-64 space-y-4 p-1">
            <section>
              <p class="mb-2 text-sm font-semibold">Primary</p>
              <div class="grid grid-cols-7 gap-2" aria-label="Elegir color primario">
                @for (color of primaryColors; track color.value) {
                  <button
                    pButton
                    type="button"
                    text
                    rounded
                    class="size-6 border-2 border-base-100 shadow-sm"
                    [style.background]="color.hex"
                    [attr.aria-label]="'Color primario ' + color.name"
                    [attr.aria-pressed]="selectedPrimary === color.value"
                    (click)="setPrimaryColor(color.value)"
                  ></button>
                }
              </div>
            </section>

            <section>
              <p class="mb-2 text-sm font-semibold">Presets</p>
              <p-selectbutton
                [options]="presetOptions"
                [(ngModel)]="selectedPreset"
                optionLabel="label"
                optionValue="value"
                (onChange)="setPreset($event.value)"
                ariaLabel="Elegir preset de PrimeNG"
              ></p-selectbutton>
            </section>
          </div>
        </p-popover>
      </div>
    </nav>
